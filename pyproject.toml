[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "torchtitan-ascend"
version = "0.1.0.dev0"
description = "Ascend NPU training extensions for TorchTitan"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-BSD-3-Clause", "Third_Party_Open_Source_Software_Notice"]
dependencies = ["torchtitan==0.4.0", "attn-gym==0.0.17"]

[project.optional-dependencies]
test = ["pytest"]
# Match TorchTitan v0.4.0 requirements-dev.txt; runtime dependencies stay above.
dev = [
    "expecttest>=0.2.0",
    "pytest==7.3.2",
    "pytest-cov",
    "pre-commit",
    "pyrefly==0.45.1",
    "transformers",
    "numpy",
]

[tool.setuptools.packages.find]
include = ["torchtitan_ascend*"]

[tool.usort]
# Preserve upstream import grouping for sparsely migrated tests.
known_first_party = ["tests"]

[tool.pyrefly]
python-version = "3.12"
project-includes = ["torchtitan_ascend/**/*.py", "tests/**/*.py", "pre-commit/**/*.py"]
# These external runtime packages are unavailable in the isolated lint env.
# Internal Ascend modules remain fully checked.
replace-imports-with-any = ["torch", "torch.*", "torch_npu", "torch_npu.*", "torchtitan", "torchtitan.*", "torchtitan_recipes.*", "pytest", "renderers", "spmd_types", "spmd_types.*", "fla_npu.*", "tensorboard.*", "attn_gym", "attn_gym.*", "torch_remat", "torch_remat.*", "triton", "triton.*", "cann_ops_nn", "cann_ops_nn.*"]

[tool.codespell]
skip = ["*.json"]
# CANN is the Ascend toolkit name.
ignore-words-list = ["assertin", "datas" ,"indx", "inpt", "nd", "socio-economic", "cann"]

[tool.pytest.ini_options]
markers = [
    "npu: tests requiring Ascend NPUs",
    "multi_gpu: tests requiring multiple accelerator devices",
]
